<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FocusFlow AI - Premium Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Inter,Arial,sans-serif;
background:#050816;
color:#fff;
overflow-x:hidden;
}
.bg{
position:fixed;inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(0,255,255,.15),transparent 30%),
radial-gradient(circle at 80% 30%,rgba(128,0,255,.15),transparent 30%),
radial-gradient(circle at 50% 80%,rgba(0,150,255,.12),transparent 35%);
z-index:-2;
}
.grid{
position:fixed;inset:0;
background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
background-size:40px 40px;
z-index:-1;
}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.glass{
width:min(1100px,95%);
padding:50px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.1);
border-radius:30px;
box-shadow:0 0 60px rgba(0,255,255,.12);
animation:float 6s ease-in-out infinite;
}
h1{
font-size:clamp(3rem,8vw,6rem);
background:linear-gradient(90deg,#00ffff,#8b5cf6,#00ffff);
background-size:200% auto;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:shine 5s linear infinite;
}
.subtitle{opacity:.8;font-size:1.2rem;margin:15px 0 30px}
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:40px;
}
.card{
padding:25px;
border-radius:20px;
background:rgba(255,255,255,.05);
transition:.35s;
}
.card:hover{
transform:translateY(-10px) scale(1.03);
box-shadow:0 20px 40px rgba(0,255,255,.15);
}
button{
border:none;
padding:14px 28px;
border-radius:999px;
cursor:pointer;
font-size:1rem;
background:linear-gradient(90deg,#00ffff,#8b5cf6);
color:white;
}
input{
width:min(500px,90%);
padding:14px;
border-radius:14px;
border:none;
margin:20px 0;
}
#result{
margin-top:20px;
padding:20px;
border-radius:16px;
background:rgba(255,255,255,.05);
display:none;
animation:fade .6s ease;
}
.stats{
display:flex;
justify-content:center;
gap:40px;
margin-top:30px;
flex-wrap:wrap;
}
.stat b{font-size:2rem;display:block;color:#00ffff}
@keyframes shine{to{background-position:200% center}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>

<section class="hero">
<div class="glass">
<h1>FocusFlow AI</h1>
<p class="subtitle">Nền tảng AI lập kế hoạch học tập thông minh thế hệ mới</p>
<p>Nhóm 5 Bài 9 Dự Án Github Pages</p>

<div class="stats">
<div class="stat"><b id="u1">0</b>Người dùng</div>
<div class="stat"><b id="u2">0</b>Kế hoạch tạo ra</div>
<div class="stat"><b id="u3">0</b>% Hiệu quả</div>
</div>

<div class="cards">
<div class="card">🤖 AI tự động xây dựng lộ trình học</div>
<div class="card">📈 Theo dõi tiến độ theo thời gian thực</div>
<div class="card">⏰ Tối ưu thời gian học tập</div>
</div>

<br><br>
<input id="goal" placeholder="Ví dụ: Học React trong 7 ngày">
<br>
<button onclick="generatePlan()">Tạo kế hoạch AI</button>

<div id="result"></div>
</div>
</section>

<script>
function animate(id,target,speed){
let n=0;
const el=document.getElementById(id);
const t=setInterval(()=>{
n+=Math.ceil(target/100);
if(n>=target){n=target;clearInterval(t)}
el.textContent=n.toLocaleString();
},speed);
}
animate('u1',12500,20);
animate('u2',89000,10);
animate('u3',97,30);

function generatePlan(){
const g=document.getElementById('goal').value || 'Lập trình Web';
const r=document.getElementById('result');
r.style.display='block';
r.innerHTML=`
<h2>Kế hoạch AI cho: ${g}</h2>
<ul style="line-height:2;margin-top:10px">
<li>Ngày 1-2: Nghiên cứu kiến thức nền tảng</li>
<li>Ngày 3-4: Thực hành dự án nhỏ</li>
<li>Ngày 5-6: Tối ưu và sửa lỗi</li>
<li>Ngày 7: Hoàn thiện & trình bày sản phẩm</li>
</ul>`;
}

document.addEventListener("mousemove",(e)=>{
const x=(e.clientX/window.innerWidth-0.5)*10;
const y=(e.clientY/window.innerHeight-0.5)*10;
document.querySelector(".glass").style.transform=`rotateY(${x}deg) rotateX(${-y}deg)`;
});
</script>
</body>
</html>
